    function getBestSpanishMaleVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      const spanishVoices = voices.filter(v => v.lang.startsWith('es') || v.lang.includes('Spanish') || v.lang.includes('es-'));
      if (spanishVoices.length === 0) return null;

      const maleKeywords = ['alvaro', 'jorge', 'gonzalo', 'diego', 'pablo', 'carlos', 'manuel', 'david', 'male', 'hombre', 'enrique', 'miguel', 'raul', 'julio', 'hector', 'tomas'];

      for (const v of spanishVoices) {
        const vName = v.name.toLowerCase();
        const isMale = maleKeywords.some(k => vName.includes(k));
        const isNatural = vName.includes('natural') || vName.includes('online') || vName.includes('neural') || vName.includes('google');
        if (isMale && isNatural) return v;
      }

      for (const v of spanishVoices) {
        const vName = v.name.toLowerCase();
        if (maleKeywords.some(k => vName.includes(k))) return v;
      }

      const naturalAny = spanishVoices.find(v => v.name.toLowerCase().includes('natural') || v.name.toLowerCase().includes('google'));
      if (naturalAny) return naturalAny;

      return spanishVoices[0];
    }

              const res = await fetch(`https://cdn.jsdelivr.net/gh/maatheusgois/bible@main/versions/es/rvr/${bookCode}/${bookCode}.json`);
              if (!res.ok) throw new Error('CDN error');
              bookData = await res.json();
            } catch (cdnErr) {
              const res2 = await fetch(`https://raw.githubusercontent.com/maatheusgois/bible/main/versions/es/rvr/${bookCode}/${bookCode}.json`);
              if (!res2.ok) throw new Error('GitHub error');
              bookData = await res2.json();
            }
            BOOK_CACHE[bookCode] = bookData;
          }

          if (bookData && bookData.chapters && bookData.chapters[chapter - 1]) {
            const rawChapter = bookData.chapters[chapter - 1];
            const parsedVerses = rawChapter.map((verseText, idx) => ({
              verse: idx + 1,
              text: verseText
            }));
            setVerses(parsedVerses);
          } else {
            throw new Error('Capítulo no encontrado');
          }
        } catch (err) {
          setError(`No pudimos cargar ${book.name} ${chapter}. Por favor revisa tu conexión.`);
          setVerses([]);
        }
        setLoading(false);
      };

      // =======================================================================
      // SISTEMA DE AUDIO VERSÍCULO A VERSÍCULO
      // =======================================================================
      const startSpeechFromVerse = (startIdx = 0) => {
        if (!('speechSynthesis' in window) || verses.length === 0) return;

        window.speechSynthesis.cancel();
        audioQueueRef.current = {
          isPlaying: true,
          verseIdx: startIdx,
          verses: verses
        };
        setIsSpeaking(true);
        playNextVerseInQueue();
      };

      const playNextVerseInQueue = () => {
        const queue = audioQueueRef.current;
        if (!queue.isPlaying || queue.verseIdx >= queue.verses.length) {
          stopSpeech();
          return;
        }

        const v = queue.verses[queue.verseIdx];
        setCurrentSpeakingVerse(v.verse);

        const textToSay = queue.verseIdx === 0
          ? `${selectedBook.name}, capítulo ${selectedChapter}. Versículo 1. ${v.text}`
          : `Versículo ${v.verse}. ${v.text}`;

        const utterance = new SpeechSynthesisUtterance(textToSay);
        utterance.lang = 'es-ES';
        utterance.rate = voiceRate;
        utterance.pitch = voicePitch;

        const allVoices = window.speechSynthesis.getVoices();
        let targetVoice = allVoices.find(item => item.name === selectedVoiceName);
        if (!targetVoice) {
          targetVoice = getBestSpanishMaleVoice();
        }
        if (targetVoice) {
          utterance.voice = targetVoice;
        }

        utterance.onend = () => {
          if (audioQueueRef.current.isPlaying) {
            audioQueueRef.current.verseIdx += 1;
            playNextVerseInQueue();
          }
        };

        utterance.onerror = () => {
          if (audioQueueRef.current.isPlaying) {
            audioQueueRef.current.verseIdx += 1;
            playNextVerseInQueue();
          }
        };

        window.speechSynthesis.speak(utterance);
      };

      const testVoiceSample = () => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const sampleText = "Lámpara es a mis pies tu palabra, y lumbrera a mi camino. Salmos 119:105.";
        const utterance = new SpeechSynthesisUtterance(sampleText);
        utterance.lang = 'es-ES';
        utterance.rate = voiceRate;
        utterance.pitch = voicePitch;

        const allVoices = window.speechSynthesis.getVoices();
        let targetVoice = allVoices.find(item => item.name === selectedVoiceName);
        if (!targetVoice) targetVoice = getBestSpanishMaleVoice();
        if (targetVoice) utterance.voice = targetVoice;

        window.speechSynthesis.speak(utterance);
      };

      const toggleSpeech = () => {
        if (isSpeaking) {
          stopSpeech();
        } else {
          startSpeechFromVerse(0);
        }
      };

      const stopSpeech = () => {
        if ('speechSynthesis' in window) {

    // =========================================================================
    // MODAL TARJETA WHATSAPP CANVAS
    // =========================================================================
    function WhatsAppCardModal({ data, onClose }) {
      const canvasRef = useRef(null);
      const [theme, setTheme] = useState('sunset');

      const THEMES = {
        sunset: { name: '🌅 Atardecer Dorado', bg1: '#FF7E5F', bg2: '#FEB47B', text: '#4A2810', ref: '#C05621' },
        cosmic: { name: '🌌 Cielo Estrellado', bg1: '#1E3C72', bg2: '#2A5298', text: '#1A202C', ref: '#2B6CB0' },
        emerald: { name: '🌿 Jardín de Paz', bg1: '#11998E', bg2: '#38EF7D', text: '#1A365D', ref: '#2F855A' },
        rainbow: { name: '🎨 Arcoíris Infantil', bg1: '#FF9A9E', bg2: '#FECFEF', text: '#2D3748', ref: '#D53F8C' }
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const curTheme = THEMES[theme];

        canvas.width = 1080;
        canvas.height = 1080;

        // Fondo
        const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
        grad.addColorStop(0, curTheme.bg1);
        grad.addColorStop(1, curTheme.bg2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1080);

        // Tarjeta Central
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
        const x = 90, y = 120, w = 900, h = 840, r = 50;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Encabezado
        ctx.font = 'bold 38px sans-serif';
        ctx.fillStyle = curTheme.ref;
        ctx.textAlign = 'center';
        ctx.fillText('✨ SÚPER BIBLIA EXPLORER ✨', 540, 220);

        // Versículo
        ctx.font = 'italic 44px Georgia, serif';
        ctx.fillStyle = curTheme.text;
        const words = `"${data.text}"`.split(' ');
        let line = '';
        const lines = [];
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          if (ctx.measureText(testLine).width > 760 && n > 0) {
            lines.push(line);
            line = words[n] + ' ';
          } else {
            line = testLine;
          }
        }
        lines.push(line);

        const startY = 460 - (lines.length * 30);
        for (let k = 0; k < lines.length; k++) {
          ctx.fillText(lines[k].trim(), 540, startY + (k * 62));
        }

        // Cita
        ctx.font = 'bold 48px sans-serif';
        ctx.fillStyle = curTheme.ref;
        ctx.fillText(`📖 ${data.bookName} ${data.chapter}:${data.verse}`, 540, 780);

        ctx.font = '500 28px sans-serif';
        ctx.fillStyle = '#718096';
        ctx.fillText('Reina Valera 1960 • Comparte la Palabra', 540, 850);
      }, [theme, data]);

      const handleDownload = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const link = document.createElement('a');
        link.download = `Versiculo_${data.bookName}_${data.chapter}_${data.verse}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      };

      const handleShare = async () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        if (navigator.share && navigator.canShare) {
          canvas.toBlob(async (blob) => {
            const file = new File([blob], `Versiculo_${data.bookName}.png`, { type: 'image/png' });
            try {
              await navigator.share({
                title: `${data.bookName} ${data.chapter}:${data.verse}`,
                text: `"${data.text}" - Súper Biblia Explorer`,
                files: [file]
              });
            } catch {}
          });
        } else {
          handleDownload();
        }
      };

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl border-2 border-purple-200 my-8">
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-black text-lg text-slate-800">🎨 Tarjeta de Versículo para WhatsApp</h3>
              <button onClick={onClose} className="text-lg">✕</button>
            </div>

            <div className="rounded-2xl overflow-hidden shadow-inner border border-slate-200 mb-4 bg-slate-100 flex items-center justify-center">
              <canvas ref={canvasRef} className="w-full max-h-[300px] object-contain" />
            </div>

            <div className="grid grid-cols-2 gap-2 mb-5">
              {Object.keys(THEMES).map(tKey => (
                <button
                  key={tKey}
                  onClick={() => setTheme(tKey)}
                  className={`p-2.5 rounded-xl text-xs font-bold text-left border ${
                    theme === tKey ? 'bg-purple-50 border-purple-500 text-purple-900' : 'bg-slate-50 border-slate-200'
                  }`}
                >
                  {THEMES[tKey].name}
                </button>
              ))}
            </div>

            <div className="flex flex-wrap gap-2 justify-end">
              <button onClick={onClose} className="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-500">Cerrar</button>
              <button onClick={handleDownload} className="px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200">
                💾 Descargar Imagen
              </button>
              <button onClick={handleShare} className="px-5 py-2.5 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-md hover:bg-emerald-700">
                📲 Compartir WhatsApp
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
